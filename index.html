<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>간단 메모장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:16px system-ui,sans-serif}main{max-width:600px;margin:32px auto;padding:16px}section,article{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #bbb;border-radius:5px}input,textarea{display:block;width:100%;margin:8px 0 16px}textarea{min-height:140px;resize:vertical}button{background:#f5f5f5;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5;cursor:wait}p{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:24px}small{color:#666}[hidden]{display:none!important}
</style>
<main>
<h1>간단 메모장</h1>
<section id="auth">
<form id="login">
<label for="email">이메일</label><input id="email" type="email" autocomplete="username" required>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="6" required>
<button type="submit">로그인</button><button type="button" id="signup">회원가입</button>
</form>
</section>
<section id="app" hidden>
<small id="who"></small> <button id="logout">로그아웃</button>
<form id="memo"><label for="content">메모 내용</label><textarea id="content" required></textarea><button type="submit" id="save">저장</button></form>
<div id="list"></div>
</section>
<p id="status" role="status" aria-live="polite">불러오는 중…</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0/dist/umd/supabase.js"></script>
<script>
const db=supabase.createClient('https://trctjebbfcelpaxsdtdw.supabase.co','sb_publishable_pbeuTz-TevMU2KE9PlHXtA_jdLKtl9K');
const $=id=>document.getElementById(id);let session=null;
function message(s){$('status').textContent=s}
async function run(task){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await task()}catch(e){message('오류: '+e.message)}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){const {data,error}=await db.from('memos').select('*').order('created_at',{ascending:false});if(error)throw error;$('list').replaceChildren();for(const row of data){const article=document.createElement('article'),p=document.createElement('p'),button=document.createElement('button');p.textContent=row.content;button.textContent='삭제';button.onclick=()=>run(async()=>{message('삭제 중…');const {error}=await db.from('memos').delete().eq('id',row.id);if(error)throw error;await load();message('삭제했습니다.')});article.append(p,button);$('list').append(article)}if(!data.length)$('list').textContent='저장된 메모가 없습니다.'}
async function show(s){session=s;$('auth').hidden=!!s;$('app').hidden=!s;$('list').replaceChildren();$('who').textContent=s?.user.email||'';if(s)await load();message('')}
async function authenticate(signup){if(!$('login').reportValidity())return;await run(async()=>{message(signup?'가입 중…':'로그인 중…');const credentials={email:$('email').value.trim(),password:$('password').value};const {data,error}=signup?await db.auth.signUp(credentials):await db.auth.signInWithPassword(credentials);if(error)throw error;if(!data.session)throw new Error('이메일 확인이 필요합니다. 실습 프로젝트 인증 설정을 확인해 주세요.');$('password').value='';await show(data.session)})}
$('login').onsubmit=e=>{e.preventDefault();authenticate(false)};$('signup').onclick=()=>authenticate(true);
$('memo').onsubmit=e=>{e.preventDefault();const content=$('content').value.trim();if(!content){message('메모 내용을 입력해 주세요.');return}run(async()=>{message('저장 중…');const {error}=await db.from('memos').insert({user_id:session.user.id,content});if(error)throw error;$('content').value='';await load();message('저장했습니다.')})};
$('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;$('content').value='';await show(null)});
db.auth.onAuthStateChange((event,s)=>{if(event==='TOKEN_REFRESHED')session=s;if(event==='SIGNED_OUT'){session=null;$('app').hidden=true;$('auth').hidden=false;$('list').replaceChildren()}});
run(async()=>{const {data,error}=await db.auth.getSession();if(error)throw error;await show(data.session)});
</script>
</html>
